<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark Rounded Background -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="#0a0a0b"/>
  
  <!-- Subtle Border Glow -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(132, 204, 22, 0.2)" stroke-width="4"/>

  <!-- "Z" Monogram -->
  <text x="50" y="72" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#f5f5f7" text-anchor="middle">Z</text>
  
  <!-- Lime Green Dot Accent -->
  <circle cx="78" cy="74" r="8" fill="#84cc16"/>
</svg>
